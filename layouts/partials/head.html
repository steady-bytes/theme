<head>
  <meta charset="utf-8" />
  <meta name="description" content={{ .Description }}>
  <meta name="keywords" content={{ .Keywords }}>
  <meta property="og:site_name" content={{ .Site.Title }} />
  <meta property="og:title" content={{ .Title }} />
  <meta property="og:description" content={{ .Description }} />
  {{ if .Params.ogImage}}
  <meta property="og:image" content="{{ .Site.BaseURL }}{{ .Params.ogImage }}" />
  {{ else }}
  <meta property="og:image" content="{{ .Site.BaseURL }}{{ .Site.Params.logo }}" />
  {{ end }}

  <title>{{ .Title }}</title>

  {{ if (ne .Site.Params.Analytics.plausibleDomain "")}}
  <script defer data-domain={{ .Site.Params.Analytics.plausibleDomain }} src={{ .Site.Params.Analytics.plausibleSrc }}></script>
  {{ end }}

  {{ range .Site.Params.mastodon.accounts }}
  <link rel="me" href="{{ . }}"/>
  {{ end }}

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />

  <!-- Themify -->
  <link rel="stylesheet" href="{{ "themify/themify.css" | absURL }}">

  <!-- Critical CSS -->
  {{ $stylex := resources.Get "scss/critical.scss" | css.Sass | minify }}
  <link href="{{ $stylex.Permalink }}" rel="stylesheet" />

  <!--Favicon-->
  <link rel="shortcut icon" href="{{ "images/favicon.png" | absURL }}" type="image/x-icon" />
  <link rel="icon" href="{{ "images/favicon.png" | absURL }}" type="image/x-icon" />
</head>
